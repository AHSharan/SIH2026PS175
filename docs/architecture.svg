<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2533"/></marker></defs>
<rect width="1600" height="600" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="800" fill="#1d2533">DepthWizard: one satellite image → 3D elevation map</text>
<rect x="40" y="150" width="290" height="140" rx="16" fill="#fff" stroke="#1d2533" stroke-width="2.5"/>
<circle cx="70" cy="184" r="17" fill="#1d2533"/>
<text x="70" y="190.5" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">1</text>
<text x="98" y="192" font-size="22" font-weight="800" fill="#1d2533">Satellite image</text>
<text x="64" y="230" font-size="16.5" fill="#5a6679">any RGB GeoTIFF</text>
<text x="64" y="254" font-size="16.5" fill="#5a6679">demo: Sikkim, 0.3 m pixels</text>
<rect x="410" y="90" width="350" height="140" rx="16" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2.5"/>
<circle cx="440" cy="124" r="17" fill="#3b6fd8"/>
<text x="440" y="130.5" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">2</text>
<text x="468" y="132" font-size="22" font-weight="800" fill="#1d2533">Height AI</text>
<text x="434" y="170" font-size="16.5" fill="#5a6679">DINOv3 (frozen) + our trained head</text>
<text x="434" y="194" font-size="16.5" fill="#5a6679">→ height of every pixel, metres</text>
<rect x="410" y="250" width="350" height="140" rx="16" fill="#fff" stroke="#1f9d63" stroke-width="2.5"/>
<circle cx="440" cy="284" r="17" fill="#1f9d63"/>
<text x="440" y="290.5" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3</text>
<text x="468" y="292" font-size="22" font-weight="800" fill="#1d2533">Terrain</text>
<text x="434" y="330" font-size="16.5" fill="#5a6679">Copernicus 30 m elevation map</text>
<text x="434" y="354" font-size="16.5" fill="#5a6679">(or ISRO CartoDEM)</text>
<rect x="840" y="150" width="330" height="140" rx="16" fill="#fff" stroke="#1f9d63" stroke-width="2.5"/>
<circle cx="870" cy="184" r="17" fill="#1f9d63"/>
<text x="870" y="190.5" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">4</text>
<text x="898" y="192" font-size="22" font-weight="800" fill="#1d2533">Elevation map</text>
<text x="864" y="230" font-size="16.5" fill="#5a6679">terrain + heights = DSM</text>
<text x="864" y="254" font-size="16.5" fill="#5a6679">standard GeoTIFF (QGIS/ArcGIS)</text>
<rect x="1250" y="150" width="310" height="140" rx="16" fill="#fff" stroke="#d9822b" stroke-width="2.5"/>
<circle cx="1280" cy="184" r="17" fill="#d9822b"/>
<text x="1280" y="190.5" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">5</text>
<text x="1308" y="192" font-size="22" font-weight="800" fill="#1d2533">3D fly-through</text>
<text x="1274" y="230" font-size="16.5" fill="#5a6679">probe heights · measure</text>
<text x="1274" y="254" font-size="16.5" fill="#5a6679">flood levels · video tour</text>
<path d="M330,220 L370,220 L370,160.0 L406,160.0" fill="none" stroke="#1d2533" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M370,220 L370,320.0 L406,320.0" fill="none" stroke="#1d2533" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M760,160.0 L800,160.0 L800,220 L836,220" fill="none" stroke="#1d2533" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M760,320.0 L800,320.0 L800,220" fill="none" stroke="#1d2533" stroke-width="2.6"/>
<path d="M1170,220 L1246,220" fill="none" stroke="#1d2533" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="585" y="78" text-anchor="middle" font-size="14.5" fill="#3b6fd8" font-style="italic">trained once on 1,500 US tiles with LiDAR heights</text>
<rect x="40" y="440" width="500" height="92" rx="14" fill="#6b4fd814" stroke="#6b4fd8" stroke-width="1.5"/>
<text x="64" y="484" font-size="30" font-weight="800" fill="#6b4fd8">4.69 m error</text>
<text x="64" y="512" font-size="15.5" fill="#1d2533">vs 6.74 m for RS3DAda (NeurIPS 2024): 30% lower</text>
<rect x="560" y="440" width="480" height="92" rx="14" fill="#6b4fd814" stroke="#6b4fd8" stroke-width="1.5"/>
<text x="584" y="484" font-size="30" font-weight="800" fill="#6b4fd8">Forest error halved</text>
<text x="584" y="512" font-size="15.5" fill="#1d2533">11.9 m → 6.0 m; wins on urban &amp; sparse too</text>
<rect x="1060" y="440" width="500" height="92" rx="14" fill="#6b4fd814" stroke="#6b4fd8" stroke-width="1.5"/>
<text x="1084" y="484" font-size="30" font-weight="800" fill="#6b4fd8">14 s per scene</text>
<text x="1084" y="512" font-size="15.5" fill="#1d2533">625 × 625 m, end to end, laptop GPU</text>
<text x="40" y="582" font-size="13" fill="#5a6679">Error = RMSE on 40 held-out LiDAR test tiles (US cities). India has no open LiDAR truth, so the Sikkim result is checked for plausibility only.</text>
</svg>