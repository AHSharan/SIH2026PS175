<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<rect width="1600" height="600" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="800" fill="#1f2933">DepthWizard: one satellite image → 3D elevation map</text>
<rect x="40" y="150" width="290" height="140" rx="10" fill="#fff" stroke="#1f3a5f" stroke-width="1.6"/>
<circle cx="70" cy="184" r="16" fill="#1f3a5f"/>
<text x="70" y="190.5" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">1</text>
<text x="98" y="192" font-size="22" font-weight="800" fill="#1f2933">Satellite image</text>
<text x="64" y="230" font-size="16.5" fill="#52606d">any RGB GeoTIFF</text>
<text x="64" y="254" font-size="16.5" fill="#52606d">demo: Sikkim, 0.3 m pixels</text>
<rect x="410" y="90" width="350" height="140" rx="10" fill="#e6ecf3" stroke="#1f3a5f" stroke-width="1.6"/>
<circle cx="440" cy="124" r="16" fill="#1f3a5f"/>
<text x="440" y="130.5" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">2</text>
<text x="468" y="132" font-size="22" font-weight="800" fill="#1f2933">Height AI</text>
<text x="434" y="170" font-size="16.5" fill="#52606d">DINOv3 (frozen) + our trained head</text>
<text x="434" y="194" font-size="16.5" fill="#52606d">→ height of every pixel, metres</text>
<rect x="410" y="250" width="350" height="140" rx="10" fill="#fff" stroke="#1f3a5f" stroke-width="1.6"/>
<circle cx="440" cy="284" r="16" fill="#1f3a5f"/>
<text x="440" y="290.5" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3</text>
<text x="468" y="292" font-size="22" font-weight="800" fill="#1f2933">Terrain</text>
<text x="434" y="330" font-size="16.5" fill="#52606d">Copernicus 30 m elevation map</text>
<text x="434" y="354" font-size="16.5" fill="#52606d">(or ISRO CartoDEM)</text>
<rect x="840" y="150" width="330" height="140" rx="10" fill="#fff" stroke="#1f3a5f" stroke-width="1.6"/>
<circle cx="870" cy="184" r="16" fill="#1f3a5f"/>
<text x="870" y="190.5" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">4</text>
<text x="898" y="192" font-size="22" font-weight="800" fill="#1f2933">Elevation map</text>
<text x="864" y="230" font-size="16.5" fill="#52606d">terrain + heights = DSM</text>
<text x="864" y="254" font-size="16.5" fill="#52606d">standard GeoTIFF (QGIS/ArcGIS)</text>
<rect x="1250" y="150" width="310" height="140" rx="10" fill="#fff" stroke="#1f3a5f" stroke-width="1.6"/>
<circle cx="1280" cy="184" r="16" fill="#1f3a5f"/>
<text x="1280" y="190.5" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">5</text>
<text x="1308" y="192" font-size="22" font-weight="800" fill="#1f2933">3D fly-through</text>
<text x="1274" y="230" font-size="16.5" fill="#52606d">probe heights · measure</text>
<text x="1274" y="254" font-size="16.5" fill="#52606d">flood levels · video tour</text>
<path d="M330,220 L370,220 L370,160.0 L406,160.0" fill="none" stroke="#1f2933" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M370,220 L370,320.0 L406,320.0" fill="none" stroke="#1f2933" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M760,160.0 L800,160.0 L800,220 L836,220" fill="none" stroke="#1f2933" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M760,320.0 L800,320.0 L800,220" fill="none" stroke="#1f2933" stroke-width="2.6"/>
<path d="M1170,220 L1246,220" fill="none" stroke="#1f2933" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="585" y="78" text-anchor="middle" font-size="14.5" fill="#52606d" font-style="italic">trained once on 1,500 US tiles with LiDAR heights</text>
<rect x="40" y="440" width="500" height="92" rx="8" fill="#f5f4f0" stroke="#9aa5b1" stroke-width="1"/>
<rect x="40" y="440" width="6" height="92" rx="3" fill="#b5651d"/>
<text x="64" y="484" font-size="30" font-weight="800" fill="#1f3a5f">4.69 m error</text>
<text x="64" y="512" font-size="15.5" fill="#1f2933">vs 6.74 m for RS3DAda (NeurIPS 2024): 30% lower</text>
<rect x="560" y="440" width="480" height="92" rx="8" fill="#f5f4f0" stroke="#9aa5b1" stroke-width="1"/>
<rect x="560" y="440" width="6" height="92" rx="3" fill="#b5651d"/>
<text x="584" y="484" font-size="30" font-weight="800" fill="#1f3a5f">Forest error halved</text>
<text x="584" y="512" font-size="15.5" fill="#1f2933">11.9 m → 6.0 m; better on urban &amp; sparse too</text>
<rect x="1060" y="440" width="500" height="92" rx="8" fill="#f5f4f0" stroke="#9aa5b1" stroke-width="1"/>
<rect x="1060" y="440" width="6" height="92" rx="3" fill="#b5651d"/>
<text x="1084" y="484" font-size="30" font-weight="800" fill="#1f3a5f">14 s per scene</text>
<text x="1084" y="512" font-size="15.5" fill="#1f2933">625 × 625 m, end to end, laptop GPU</text>
<text x="40" y="582" font-size="13" fill="#52606d">Error = RMSE against LiDAR on 40 held-out test tiles.</text>
</svg>