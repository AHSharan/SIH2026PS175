<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<rect width="1600" height="790" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="800" fill="#1f2933">DepthWizard: one satellite image → 3D elevation map</text>
<rect x="40" y="88" width="1520" height="96" rx="10" fill="#f5f4f0" stroke="#9aa5b1" stroke-width="1"/>
<text x="60" y="114" font-size="13" font-weight="700" fill="#52606d" letter-spacing="1">TRAINING · OFFLINE, ONCE</text>
<rect x="300" y="104" width="300" height="62" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="316" y="130" font-size="15.5" font-weight="700" fill="#1f2933">GAMUS: 1,500 tiles</text>
<text x="316" y="152" font-size="13.5" fill="#52606d">US aerial RGB + LiDAR heights, 0.3 m</text>
<rect x="630" y="104" width="300" height="62" rx="8" fill="#e6ecf3" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="646" y="130" font-size="15.5" font-weight="700" fill="#1f2933">DINOv3 ViT-L (frozen)</text>
<text x="646" y="152" font-size="13.5" fill="#52606d">pre-trained on 493 M satellite images</text>
<rect x="960" y="104" width="260" height="62" rx="8" fill="#e6ecf3" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="976" y="130" font-size="15.5" font-weight="700" fill="#1f2933">Height head (trained)</text>
<text x="976" y="152" font-size="13.5" fill="#52606d">12.7 M parameters, 30 epochs</text>
<rect x="1250" y="104" width="290" height="62" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="1266" y="130" font-size="15.5" font-weight="700" fill="#1f2933">best.pt</text>
<text x="1266" y="152" font-size="13.5" fill="#52606d">picked on validation, never on test</text>
<path d="M600,135 L626,135" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/>
<path d="M930,135 L956,135" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/>
<path d="M1220,135 L1246,135" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="302.5" width="300" height="160" rx="10" fill="#fff" stroke="#1f3a5f" stroke-width="1.6"/>
<circle cx="70" cy="336.5" r="16" fill="#1f3a5f"/>
<text x="70" y="343.0" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">1</text>
<text x="98" y="344.5" font-size="22" font-weight="800" fill="#1f2933">Satellite image</text>
<text x="64" y="380.5" font-size="15.5" fill="#52606d">any RGB GeoTIFF</text>
<text x="64" y="403.5" font-size="15.5" fill="#52606d">keeps its map position</text>
<text x="64" y="426.5" font-size="15.5" fill="#52606d">demo: Sikkim, 0.3 m pixels</text>
<rect x="410" y="230" width="360" height="140" rx="10" fill="#e6ecf3" stroke="#1f3a5f" stroke-width="1.6"/>
<circle cx="440" cy="264" r="16" fill="#1f3a5f"/>
<text x="440" y="270.5" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">2</text>
<text x="468" y="272" font-size="22" font-weight="800" fill="#1f2933">Height AI</text>
<text x="434" y="308" font-size="15.5" fill="#52606d">scale to 0.5 m · 608 px tiles, 25% overlap</text>
<text x="434" y="331" font-size="15.5" fill="#52606d">flip averaging for stable results</text>
<text x="434" y="354" font-size="15.5" fill="#52606d">→ height of every pixel, metres</text>
<rect x="410" y="395" width="360" height="140" rx="10" fill="#fff" stroke="#1f3a5f" stroke-width="1.6"/>
<circle cx="440" cy="429" r="16" fill="#1f3a5f"/>
<text x="440" y="435.5" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3</text>
<text x="468" y="437" font-size="22" font-weight="800" fill="#1f2933">Terrain</text>
<text x="434" y="473" font-size="15.5" fill="#52606d">Copernicus 30 m elevation map (auto)</text>
<text x="434" y="496" font-size="15.5" fill="#52606d">or ISRO CartoDEM</text>
<text x="434" y="519" font-size="15.5" fill="#52606d">reprojected onto the image grid</text>
<rect x="850" y="302.5" width="320" height="160" rx="10" fill="#fff" stroke="#1f3a5f" stroke-width="1.6"/>
<circle cx="880" cy="336.5" r="16" fill="#1f3a5f"/>
<text x="880" y="343.0" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">4</text>
<text x="908" y="344.5" font-size="22" font-weight="800" fill="#1f2933">Elevation map</text>
<text x="874" y="380.5" font-size="15.5" fill="#52606d">DSM = terrain + heights</text>
<text x="874" y="403.5" font-size="15.5" fill="#52606d">dsm · ndsm · dem GeoTIFFs</text>
<text x="874" y="426.5" font-size="15.5" fill="#52606d">opens in QGIS / ArcGIS</text>
<rect x="1250" y="302.5" width="310" height="160" rx="10" fill="#fff" stroke="#1f3a5f" stroke-width="1.6"/>
<circle cx="1280" cy="336.5" r="16" fill="#1f3a5f"/>
<text x="1280" y="343.0" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">5</text>
<text x="1308" y="344.5" font-size="22" font-weight="800" fill="#1f2933">3D fly-through</text>
<text x="1274" y="380.5" font-size="15.5" fill="#52606d">probe heights · measure</text>
<text x="1274" y="403.5" font-size="15.5" fill="#52606d">height profiles · flood levels</text>
<text x="1274" y="426.5" font-size="15.5" fill="#52606d">building floors · video tour</text>
<path d="M340,382.5 L375,382.5 L375,300.0 L406,300.0" fill="none" stroke="#1f2933" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M375,382.5 L375,465.0 L406,465.0" fill="none" stroke="#1f2933" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M770,300.0 L810,300.0 L810,382.5 L846,382.5" fill="none" stroke="#1f2933" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M770,465.0 L810,465.0 L810,382.5" fill="none" stroke="#1f2933" stroke-width="2.6"/>
<path d="M1170,382.5 L1246,382.5" fill="none" stroke="#1f2933" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M1395,166 L1395,206 L590,206 L590,226" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/>
<text x="600" y="200" font-size="13" fill="#52606d" font-style="italic">trained weights</text>
<rect x="40" y="610" width="500" height="92" rx="8" fill="#f5f4f0" stroke="#9aa5b1" stroke-width="1"/>
<rect x="40" y="610" width="6" height="92" rx="3" fill="#b5651d"/>
<text x="64" y="654" font-size="30" font-weight="800" fill="#1f3a5f">4.69 m error</text>
<text x="64" y="682" font-size="15.5" fill="#1f2933">vs 6.74 m for RS3DAda (NeurIPS 2024): 30% lower</text>
<rect x="560" y="610" width="480" height="92" rx="8" fill="#f5f4f0" stroke="#9aa5b1" stroke-width="1"/>
<rect x="560" y="610" width="6" height="92" rx="3" fill="#b5651d"/>
<text x="584" y="654" font-size="30" font-weight="800" fill="#1f3a5f">Forest error halved</text>
<text x="584" y="682" font-size="15.5" fill="#1f2933">11.9 m → 6.0 m; better on urban &amp; sparse too</text>
<rect x="1060" y="610" width="500" height="92" rx="8" fill="#f5f4f0" stroke="#9aa5b1" stroke-width="1"/>
<rect x="1060" y="610" width="6" height="92" rx="3" fill="#b5651d"/>
<text x="1084" y="654" font-size="30" font-weight="800" fill="#1f3a5f">14 s per scene</text>
<text x="1084" y="682" font-size="15.5" fill="#1f2933">625 × 625 m, end to end, laptop GPU</text>
<text x="40" y="768" font-size="13" fill="#52606d">Error = RMSE against LiDAR on 40 held-out test tiles.</text>
</svg>